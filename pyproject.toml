[project]
name = "bocek"
version = "0.1.0"
description = "Discord bot to keep you company."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "bs4>=0.0.2",
    "discord-py[voice]>=2.4.0",
    "google-api-core>=2.9.0",
    "google-api-python-client>=2.154.0",
    "google-cloud-texttospeech>=2.12.3",
    "google-cloud>=0.34.0",
    "gtts>=2.5.4",
    "python-dotenv>=1.0.1",
    "tabulate>=0.9.0",
    "unidecode>=1.3.8",
    "pynacl>=1.5.0",
    "grpcio>=1.68.0",
    "grpcio-tools>=1.62.3",
    "aiohttp>=3.11.7",
    "async-property>=0.2.2",
    "mutagen>=1.47.0",
    "niquests>=3.12.1",
    "loguru>=0.7.3",
    "yarl>=1.18.0",
    "setuptools>=75.0.0",
    "pydub>=0.25.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8.0",
]

[tool.ruff]
extend-select = ["I"]
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
